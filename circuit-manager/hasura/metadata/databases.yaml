version: 3
sources:
  - name: default
    kind: postgres
    tables:
      - table: { schema: public, name: users }
      - table: { schema: public, name: sessions }
      - table: { schema: public, name: locations }
        object_relationships:
          - name: owner
            using:
              foreign_key_constraint_on: owner_id
        array_relationships:
          - name: location_access
            using:
              foreign_key_constraint_on: { table: { schema: public, name: location_access }, column: location_id }
          - name: areas
            using:
              foreign_key_constraint_on: { table: { schema: public, name: areas }, column: location_id }
          - name: assets
            using:
              foreign_key_constraint_on: { table: { schema: public, name: assets }, column: location_id }
          - name: services
            using:
              foreign_key_constraint_on: { table: { schema: public, name: services }, column: location_id }
      - table: { schema: public, name: location_access }
        object_relationships:
          - name: location
            using: { foreign_key_constraint_on: location_id }
          - name: user
            using: { foreign_key_constraint_on: user_id }
      - table: { schema: public, name: areas }
        object_relationships:
          - name: location
            using: { foreign_key_constraint_on: location_id }
          - name: parent
            using: { foreign_key_constraint_on: parent_id }
        array_relationships:
          - name: children
            using:
              foreign_key_constraint_on: { table: { schema: public, name: areas }, column: parent_id }
          - name: assets
            using:
              foreign_key_constraint_on: { table: { schema: public, name: assets }, column: area_id }
      - table: { schema: public, name: services }
        object_relationships:
          - name: location
            using: { foreign_key_constraint_on: location_id }
        array_relationships:
          - name: panels
            using:
              foreign_key_constraint_on: { table: { schema: public, name: panels }, column: service_id }
      - table: { schema: public, name: panels }
        object_relationships:
          - name: service
            using: { foreign_key_constraint_on: service_id }
          - name: parent
            using: { foreign_key_constraint_on: parent_id }
          - name: area
            using: { foreign_key_constraint_on: area_id }
        array_relationships:
          - name: children
            using:
              foreign_key_constraint_on: { table: { schema: public, name: panels }, column: parent_id }
          - name: breakers
            using:
              foreign_key_constraint_on: { table: { schema: public, name: breakers }, column: panel_id }
      - table: { schema: public, name: breakers }
        object_relationships:
          - name: panel
            using: { foreign_key_constraint_on: panel_id }
        array_relationships:
          - name: assets
            using:
              foreign_key_constraint_on: { table: { schema: public, name: assets }, column: breaker_id }
      - table: { schema: public, name: asset_types }
        array_relationships:
          - name: assets
            using:
              foreign_key_constraint_on: { table: { schema: public, name: assets }, column: asset_type_id }
      - table: { schema: public, name: assets }
        object_relationships:
          - name: location
            using: { foreign_key_constraint_on: location_id }
          - name: area
            using: { foreign_key_constraint_on: area_id }
          - name: breaker
            using: { foreign_key_constraint_on: breaker_id }
          - name: asset_type
            using: { foreign_key_constraint_on: asset_type_id }
      - table: { schema: public, name: area_type_counters }
      - table: { schema: public, name: asset_type_counters }
    configuration:
      connection_info:
        database_url:
          from_env: HASURA_GRAPHQL_DATABASE_URL
        pool_settings:
          idle_timeout: 180
          max_connections: 50
          retries: 1
